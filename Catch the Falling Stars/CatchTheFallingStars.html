<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Falling Stars</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to top, #001d3d, #003566);
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    canvas {
      display: block;
      margin: auto;
      background-color: #000;
      border: 3px solid white;
    }

    #score {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🌟 Catch the Falling Stars 🌟</h1>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const basket = {
      x: 160,
      y: 550,
      width: 80,
      height: 20,
      speed: 5,
    };

    let stars = [];
    let score = 0;
    let gameOver = false;

    function drawBasket() {
      ctx.fillStyle = 'white';
      ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
    }

    function drawStar(star) {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'yellow';
      ctx.fill();
      ctx.closePath();
    }

    function createStar() {
      const radius = 10;
      stars.push({
        x: Math.random() * (canvas.width - radius * 2) + radius,
        y: -radius,
        radius: radius,
        speed: 2 + Math.random() * 2,
      });
    }

    function updateStars() {
      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        star.y += star.speed;

        // Check for catch
        if (
          star.y + star.radius > basket.y &&
          star.x > basket.x &&
          star.x < basket.x + basket.width
        ) {
          stars.splice(i, 1);
          score += 1;
          document.getElementById('score').textContent = `Score: ${score}`;
        } else if (star.y > canvas.height) {
          // Missed star
          gameOver = true;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBasket();
      stars.forEach(drawStar);
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = 'red';
        ctx.font = '36px sans-serif';
        ctx.fillText('Game Over', 100, 300);
        return;
      }

      updateStars();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && basket.x > 0) {
        basket.x -= basket.speed;
      } else if (e.key === 'ArrowRight' && basket.x + basket.width < canvas.width) {
        basket.x += basket.speed;
      }
    });

    // Spawn stars every second
    setInterval(() => {
      if (!gameOver) createStar();
    }, 1000);

    gameLoop();
  </script>
</body>
</html>
